common:
  dataset: "vanjee"
  lid_topic: "/apollo/sensor/hesaiPandar128/PointCloud2"
  imu_topic: "/apollo/sensor/gnss/corrected_imu"
  time_sync_en: false         # ONLY turn on when external time synchronization is really not possible

preprocess:
  lidar_type: 5                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for Robotsense LiDAR, 5 for Hesai LiDAR,
  scan_line: 128
  blind: 3.0
  rangeMinX: -200
  rangeMaxX: 200
  rangeMinY: -200
  rangeMaxY: 200  #10
  rangeMinZ: -200.0
  rangeMaxZ: 200.0
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.001
  b_gyr_cov: 0.001
  fov_degree: 360
  det_range: 200.0
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [0.0696721 ,1.31345 ,0.942279] # 郑州列检
  extrinsic_R: [-0.9994787, -0.0306943,  0.0100106,
                 0.0307296, -0.9995220,  0.0033907,
                 0.0099017,  0.0036965,  0.9999442  ]

publish:
  path_publish_en: false
  scan_publish_en: true       # false: close all the point cloud output
  scan_effect_pub_en: true    # true: publish the pointscloud of effect point
  dense_publish_en: false       # false: low down the points number in a global-frame point clouds scan.
  scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

path_save_en: true                 # 保存轨迹，用于精度计算和比较

pcd_save:
  pcd_save_en: false
  interval: -1                 # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

# feature_extract_enable: true
point_filter_num: 5
max_iteration: 5
filter_size_surf: 0.1
filter_size_map: 0.5
cube_side_length: 100000

ivox_grid_resolution: 0.3        # default=0.2
ivox_nearby_type: 18             # 6, 18, 26
esti_plane_threshold: 0.1        # default=0.1